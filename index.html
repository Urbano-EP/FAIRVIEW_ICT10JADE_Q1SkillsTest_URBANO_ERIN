<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>


</head>
<body>

    <h1>Receipt Generator</h1>
    <br>
    <form>
        <input type="text" id="input1" placeholder="Enter a number" >
        <br>
        <input type="text" id="input2" placeholder="Enter a number" >
        <br>
        <button type="button" py-click="add_num">Solve</button>
        <br>
        <br>
        <label for="choose">Choose:</label>
        <br>
        <input type="checkbox" id="item1" value="129">
        <label for="item1">Spanish Latte</label>
        <br>
        <br>
        <label for="choose">Choose:</label>
        <br>
        <input type="radio" id="regular" value="0" name="size">
        <label for="regular">Regular (+Php 0)</label>
        <br>
        <input type="radio" id="upsize" value="30" name="size">
        <label for="upsize">Upsize (+Php 30)</label>

        <button type="button" py-click="create_order">Create Order</button>
        <br>
        <br>
        <label for="options">Select Coffee</label>
        <br>
        <select id="coffee">
            <option value="0">Choose an option</option>
            <option value="99">Americano</option>
            <option value="129">Spanish Latte</option>
            <option value="159">Cappuccino</option>
        </select>
        <br>
        <button type="button" py-click="place_order">Place Order</button>
        <br>

        <br>
        <button type="button" py-click="show_order">Show Order</button>

    </form>

    <div id="output1"></div>
    <div id="output2"></div>
    <div id="output3"></div>
    <div id="output4"></div>
    <script type="py" src="main.py"></script>

</body>
</html>
