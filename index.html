<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>


</head>
<body>
    
    <h1>ICE CREAM SHOP</h1>
    <br>
    <form>
        
        <label for="choose">Choose:</label>
        <br>

        <input type="checkbox" id="item1" value="50">
        <label for="item1">Chocolate</label>
        <br>

        <input type="checkbox" id="item2" value="45">
        <label for="item2">Strawberry</label>
        <br>

        <input type="checkbox" id="item3" value="40">
        <label for="item3">Vanilla</label>
        <br>

        <input type="checkbox" id="item4" value="35">
        <label for="item4">Cookies and Cream</label>
        <br>

        <input type="checkbox" id="item5" value="55">
        <label for="item5">Cotton Candy</label>
        <br>

        <br>
        <label for="choose">Choose:</label>
        <br>
        <input type="radio" id="regular" value="0" name="size">
        <label for="regular">Regular (+Php 0)</label>
        <br>
        <input type="radio" id="upsize" value="30" name="size">
        <label for="upsize">Upsize (+Php 15)</label>

        <button type="button" py-click="create_order">Create Order</button>
        <br>
        <br>

    </form>

    <div id="output1"></div>
    <div id="output2"></div>
    <div id="output3"></div>
    <div id="output4"></div>
    <script type="py" src="main.py"></script>

</body>
</html>
