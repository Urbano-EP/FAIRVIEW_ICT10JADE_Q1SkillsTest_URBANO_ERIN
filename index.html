<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE CREAM</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

   <style>
    body {
        font-family: Arial;
        text-align: center;
        background-color: lightblue;
    }

    h1 {
        color: #3480b3;
    }

    label {
        font-weight: bold;
        color: #b33434;
    }

    button {
        background-color: #3480b3;
        color: rgb(0, 0, 0);
        border-radius: 5px;
        margin: 5px;
        padding: 10px 20px;
        
    }
   </style>

</head>
<body>

    <h1>ICE CREAM SHOP</h1>
    <br>
    <form>
        <label>Choose Ice Cream Flavor:</label>
        <br>

        <input type="checkbox" id="item1" value="65">
        <label for="item1">Chocolate</label>
        <br>
        <input type="checkbox" id="item2" value="55">
        <label for="item2">Strawberry</label>
        <br>
        <input type="checkbox" id="item3" value="45">
        <label for="item3">Vanilla</label>
        <br>
        <input type="checkbox" id="item4" value="40">
        <label for="item4">Mint</label>
        <br> 

        <label for="choose">Choose:</label>
        <br>
        <input type="radio" id="regular" value="0" name="size">
        <label for="regular">Regular (+Php 0)</label>
        <br>
        <input type="radio" id="upsize" value="30" name="size">
        <label for="upsize">Upsize (+Php 30)</label>
        <br>

        <br>
        <button type="button" py-click="show_order">Show Order</button>

    </form>
    <div id="output4"></div>
    <script type="py" src="main.py"></script>

</body>
</html>
